const BASE='https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard';
const params=new URLSearchParams(location.search);
let manualSelection=params.get('manual')==='1';
let season=Number(params.get('year'))||new Date().getFullYear(), week=Math.min(16,Math.max(1,Number(params.get('week'))||1));
let conference=String(params.get('conference')||'80');
const $=id=>document.getElementById(id);
$('season').value=String(season);
$('weekSelect').value=String(week);
$('conference').value=conference;

const CONFERENCE_NAMES={
  '1':'ACC','151':'American','4':'Big 12','5':'Big Ten','12':'C-USA','18':'Independent',
  '15':'MAC','17':'Mountain West','9':'Pac-12','8':'SEC','37':'Sun Belt'
};
const FAVORITES_KEY='cfb-scoreboard-favorites-v1';
let favorites;
try{
  const saved=JSON.parse(localStorage.getItem(FAVORITES_KEY));
  favorites=Array.isArray(saved)?saved:['LSU'];
}catch{favorites=['LSU'];}
function saveFavorites(){localStorage.setItem(FAVORITES_KEY,JSON.stringify(favorites));}
function isFavorite(name){return favorites.includes(name);}
function toggleFavorite(name){
  favorites=isFavorite(name)?favorites.filter(x=>x!==name):[...favorites,name];
  saveFavorites();
  syncNotificationPreferences().catch(()=>{});
  if(window.lastEvents)render(window.lastEvents);
}

const COLLAPSED_KEY='cfb-scoreboard-collapsed-days-v1';
let collapsedDays;
try{collapsedDays=new Set(JSON.parse(localStorage.getItem(COLLAPSED_KEY))||[]);}catch{collapsedDays=new Set();}
function saveCollapsed(){localStorage.setItem(COLLAPSED_KEY,JSON.stringify([...collapsedDays]));}
function toggleDay(dateKey){collapsedDays.has(dateKey)?collapsedDays.delete(dateKey):collapsedDays.add(dateKey);saveCollapsed();if(window.lastEvents)render(window.lastEvents);}

const UPSET_STATE_KEY='cfb-scoreboard-upset-state-v1';
let upsetStates;
try{upsetStates=JSON.parse(localStorage.getItem(UPSET_STATE_KEY))||{};}catch{upsetStates={};}
function saveUpsetStates(){localStorage.setItem(UPSET_STATE_KEY,JSON.stringify(upsetStates));}


function time(date){
  return new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'}).format(new Date(date));
}
function dayLabel(date){
  return new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',weekday:'long',month:'long',day:'numeric'}).format(new Date(date));
}
function weekdayCentral(date){
  return new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',weekday:'long'}).format(new Date(date));
}
function ymdCentral(date){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(date));
  const get=t=>parts.find(p=>p.type===t)?.value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}
function addDaysYMD(ymd,days){
  const [y,m,d]=ymd.split('-').map(Number);
  const dt=new Date(Date.UTC(y,m-1,d));
  dt.setUTCDate(dt.getUTCDate()+days);
  return dt.toISOString().slice(0,10);
}
function compactYMD(ymd){return ymd.replaceAll('-','');}
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const NICKNAME_OVERRIDES={'LSU':'Fighting Tigers'};
function normalizeSchool(name){return String(name||'').trim().toLowerCase().replace(/ university$/,'');}
function schoolName(team){return team.location||team.shortDisplayName||team.abbreviation||'Unknown team';}
function nickname(team){return NICKNAME_OVERRIDES[schoolName(team)]||team.name||'';}
function recordSummary(competitor,type){
  const records=competitor.records||[];
  const wanted=records.find(r=>String(r.type||'').toLowerCase()===type)||records.find(r=>String(r.name||'').toLowerCase()===type);
  return wanted?.summary||'';
}
function overallRecord(competitor){return recordSummary(competitor,'total')||recordSummary(competitor,'overall')||competitor.records?.[0]?.summary||'';}
function conferenceRecord(competitor){
  const records=competitor.records||[];
  const found=records.find(r=>['vsconf','conference','conf'].includes(String(r.type||'').toLowerCase()))||records.find(r=>/conference|conf/i.test(String(r.name||'')));
  return found?.summary||'';
}
function rivalryName(teams){
  const names=teams.map(t=>normalizeSchool(schoolName(t.team||{}))).sort();
  return RIVALRIES[names.join('|')]||'';
}
function hexColor(value){
  let v=String(value||'').replace('#','').trim();
  if(!/^[0-9a-fA-F]{6}$/.test(v))return '#52657d';
  return '#'+v.toUpperCase();
}
function visibleTeamColor(hex){
  const h=hexColor(hex);
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  const luminance=.2126*r+.7152*g+.0722*b;
  if(luminance>=72)return h;
  const target=82,amount=Math.min(.45,(target-luminance)/180);
  const mix=v=>Math.round(v+(255-v)*amount).toString(16).padStart(2,'0');
  return '#'+mix(r)+mix(g)+mix(b);
}
function hexTint(hex,alpha='38'){return visibleTeamColor(hex)+alpha;}
function teamConference(competitor){
  const team=competitor.team||{};
  const raw=team.conferenceId??competitor.conferenceId??team.conference?.id;
  const direct=team.conference?.abbreviation||team.conference?.shortName||team.conference?.name;
  return direct||CONFERENCE_NAMES[String(raw)]||'';
}
function orderedTeams(comp){
  const teams=[...(comp.competitors||[])];
  teams.sort((a,b)=>{
    const order={away:0,home:1};
    return (order[a.homeAway]??2)-(order[b.homeAway]??2);
  });
  return teams;
}
function teamRank(t){
  const rank=Number(t?.curatedRank?.current);
  return Number.isFinite(rank)&&rank>0&&rank<=25?rank:null;
}
function isRankedMatchup(teams){
  return teams.length>=2&&teams.slice(0,2).every(t=>teamRank(t)!==null);
}
function livePeriod(e){

function isUpsetAlert(e){

  if(state!=='in')return false;

function statLeaderHTML(category,kind){

// Fetch full-season team leaders on demand rather than for every scheduled card.
const seasonLeaderCache=new Map();
const CORE_LEADERS='https://sports.core.api.espn.com/v2/sports/football/leagues/college-football';
function seasonCategory(payload,kind){
  const data=payload?.leaders||payload||{};
  const cats=Array.isArray(data.categories)?data.categories:Array.isArray(data)?data:[];
  const exact=kind+'Leader';
  return cats.find(c=>String(c.name||'').toLowerCase()===exact.toLowerCase())||
    cats.find(c=>String(c.name||c.displayName||'').toLowerCase().includes(kind)&&Array.isArray(c.leaders)&&c.leaders.length)||null;
}
async function getSeasonLeaders(teamId,year){
  const key=year+':'+teamId;
  if(seasonLeaderCache.has(key))return seasonLeaderCache.get(key);
  const paths=[
    BASE.replace('/scoreboard','/teams')+'/'+encodeURIComponent(teamId)+'/leaders?season='+encodeURIComponent(year),
    CORE_LEADERS+'/seasons/'+encodeURIComponent(year)+'/types/2/teams/'+encodeURIComponent(teamId)+'/leaders'
  ];
  let result=null;
  for(const path of paths){
    try{
      const response=await fetchJSON(path);
      if(['passing','rushing','receiving'].some(k=>seasonCategory(response,k)?.leaders?.length)){
        result=response;
        break;
      }
    }catch(err){console.warn('Season leader source unavailable:',err.message);}
  }
  seasonLeaderCache.set(key,result);
  return result;
}
async function leaderName(leader){
  const athlete=leader?.athlete||leader?.athletes?.[0]||{};
  const name=athlete.shortName||athlete.displayName||athlete.fullName||athlete.name;
  if(name)return name;
  if(typeof athlete.$ref==='string'){
    try{
      const url=new URL(athlete.$ref.replace(/^http:/,'https:'));
      if(url.hostname==='sports.core.api.espn.com'){
        const resolved=await fetchJSON(url.href);
        return resolved.shortName||resolved.displayName||resolved.fullName||resolved.name||'Season leader';
      }
    }catch{}
  }
  return 'Season leader';
}
function leaderStat(raw,pattern){
  const m=String(raw||'').match(pattern);
  return m?m[1]:'';
}
function seasonLeaderLine(leader,kind){
  const raw=String(leader?.displayValue||leader?.summary||'');
  const tokens=[];
  if(kind==='passing'){
    const fraction=raw.match(/(\d[\d,]*)\s*[-/]\s*(\d[\d,]*)/);
    if(fraction){
      const completed=Number(fraction[1].replace(/,/g,'')),attempted=Number(fraction[2].replace(/,/g,''));
      if(attempted>0)tokens.push((100*completed/attempted).toFixed(1)+'% CMP');
    }
    for(const [label,pattern] of [['YDS',/([\d,]+)\s*YDS/i],['TD',/([\d,]+)\s*TD/i],['INT',/([\d,]+)\s*INT/i]]){
      const value=leaderStat(raw,pattern);if(value)tokens.push(value+' '+label);
    }
  }else{
    const fields=kind==='rushing'?
      [['CAR',/([\d,]+)\s*(?:CAR|ATT)\b/i],['YDS',/([\d,]+)\s*YDS/i],['AVG',/([\d.]+)\s*(?:AVG|YPC)\b/i],['TD',/([\d,]+)\s*TD/i]]:
      [['REC',/([\d,]+)\s*REC/i],['YDS',/([\d,]+)\s*YDS/i],['AVG',/([\d.]+)\s*(?:AVG|YPR)\b/i],['TD',/([\d,]+)\s*TD/i]];
    for(const [label,pattern] of fields){
      const value=leaderStat(raw,pattern);if(value)tokens.push(value+' '+label);
    }
  }
  return tokens.length?tokens.join(' · '):(raw||'Statistics unavailable');
}
async function seasonCategoryHTML(payload,kind){
  const category=seasonCategory(payload,kind);
  const leader=category?.leaders?.[0];
  const heading=kind.charAt(0).toUpperCase()+kind.slice(1);
  if(!leader)return '<div class="stat-category"><div class="stat-category-title">'+heading+'</div><div class="stat-line">Unavailable</div></div>';
  const name=await leaderName(leader);
  return '<div class="stat-category"><div class="stat-category-title">'+heading+'</div><div class="stat-player">'+escapeHTML(name)+'</div><div class="stat-line">'+escapeHTML(seasonLeaderLine(leader,kind))+'</div></div>';
}

async function getWholeWeekEvents(){
  // Step 1: use ESPN's football week selector to find a Saturday anchor date.
  const dataGroup=conference==='top25'?'80':conference;
  const anchorURL=`${BASE}?groups=${encodeURIComponent(dataGroup)}&dates=${season}&seasontype=2&week=${week}&limit=500`;
  const anchorData=await fetchJSON(anchorURL);
  const anchorEvents=(anchorData.events||[]).filter(e=>e.date);
  if(!anchorEvents.length)return [];

  // Pick the most common local date returned by the week request. ESPN's response is
  // normally centered on the main Saturday slate. Then request Monday-Sunday around it.
  const counts=new Map();
  for(const e of anchorEvents){const d=ymdCentral(e.date);counts.set(d,(counts.get(d)||0)+1);}
  const anchorDate=[...counts.entries()].sort((a,b)=>b[1]-a[1])[0][0];
  const anchorDow=new Date(anchorDate+'T12:00:00Z').getUTCDay(); // 0=Sun ... 6=Sat
  const daysBackToMonday=(anchorDow+6)%7;
  const monday=addDaysYMD(anchorDate,-daysBackToMonday);
  const sunday=addDaysYMD(monday,6);

  // Step 2: ESPN's scoreboard reliably accepts ONE YYYYMMDD value at a time.
  // Request each day Monday-Sunday separately, then merge the results.
  // This avoids the HTTP 400 error caused by the attempted date-range syntax in v0.2.
  const days=Array.from({length:7},(_,i)=>addDaysYMD(monday,i));
  const dailyData=await Promise.all(days.map(day=>
    fetchJSON(`${BASE}?groups=${encodeURIComponent(dataGroup)}&dates=${compactYMD(day)}&limit=500`)
  ));

  // De-duplicate by ESPN event ID in case the provider ever returns an event twice.
  const unique=new Map();
  for(const data of dailyData){
    for(const e of (data.events||[])){
      if(e.date&&e.competitions?.[0]?.competitors?.length) unique.set(e.id||`${e.date}-${e.name}`,e);
    }
  }
  let events=[...unique.values()];
  if(conference==='top25'){
    events=events.filter(e=>(e.competitions?.[0]?.competitors||[]).some(c=>{const r=Number(c.curatedRank?.current);return r>0&&r<=25;}));
  }
  return events;
}

async function detectCurrentWeek(){
  try{
    // Look across the current Central-Time week for nearby FBS games, then use
    // ESPN's own week number from the nearest event. This is more dependable
    // than hard-coding a week number or assuming the calendar always starts
    // on the same date each season.
    const today=ymdCentral(new Date());
    const days=Array.from({length:7},(_,i)=>addDaysYMD(today,i-3));
    const dailyData=await Promise.all(days.map(day=>
      fetchJSON(`${BASE}?groups=80&dates=${compactYMD(day)}&limit=500`).catch(()=>({events:[]}))
    ));
    const nearby=dailyData.flatMap(d=>d.events||[]).filter(e=>e.date&&e.week?.number);
    if(nearby.length){
      const now=Date.now();
      nearby.sort((a,b)=>Math.abs(new Date(a.date).getTime()-now)-Math.abs(new Date(b.date).getTime()-now));
      const closest=nearby[0];
      const detectedWeek=Number(closest.week?.number);
      const detectedSeason=Number(closest.season?.year);
      if(detectedWeek>=1&&detectedWeek<=16)week=detectedWeek;
      if(detectedSeason>2000)season=detectedSeason;
    }
  }catch(err){console.warn('Current week detection failed; using fallback.',err);}
  if(!$('season').querySelector(`option[value="${season}"]`)){
    const option=document.createElement('option');option.value=String(season);option.textContent=String(season);$('season').prepend(option);
  }
  $('season').value=String(season);$('weekSelect').value=String(week);
}

const NOTIFY_WORKER_KEY='cfb-scoreboard-notify-worker-v1';
function notificationWorkerURL(){return (localStorage.getItem(NOTIFY_WORKER_KEY)||'').replace(/\/$/,'');}
function setNotifyMessage(message){const el=$('notifyHelp');el.textContent=message||'';el.classList.toggle('show',!!message);}
function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4),base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function getPushRegistration(){
  if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('Push notifications are not supported on this device.');
  return navigator.serviceWorker.register('./service-worker.js');
}
async function existingPushSubscription(){
  try{const reg=await getPushRegistration();return await reg.pushManager.getSubscription();}catch{return null;}
}
async function updateNotifyButton(){
  const btn=$('notifyBtn');
  const sub=await existingPushSubscription();
  const enabled=!!sub&&Notification.permission==='granted';
  btn.classList.toggle('enabled',enabled);btn.textContent=enabled?'Alerts On':'Enable Alerts';
  if(enabled)setNotifyMessage('');
}
async function ensureWorkerURL(){
  let worker=notificationWorkerURL();
  if(worker)return worker;
  worker=prompt('Paste the Cloudflare notification Worker address. You only need to do this once. Example: https://cfb-scoreboard-notifications.your-name.workers.dev');
  if(!worker)throw Error('Notification setup was cancelled.');
  worker=worker.trim().replace(/\/$/,'');
  if(!/^https:\/\//i.test(worker))throw Error('The notification service address must begin with https://');
  localStorage.setItem(NOTIFY_WORKER_KEY,worker);return worker;
}
async function syncNotificationPreferences(){
  const worker=notificationWorkerURL();if(!worker)return;
  const reg=await getPushRegistration(),sub=await reg.pushManager.getSubscription();if(!sub)return;
  await fetch(`${worker}/subscribe`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),favorites,appUrl:location.origin+location.pathname})});
}
async function enableNotifications(){
  const btn=$('notifyBtn');btn.disabled=true;setNotifyMessage('Setting up alerts…');
  try{
    // iOS requires the permission prompt to be initiated directly by the user gesture.
    // Do not await service-worker registration, a network call, or a URL prompt first.
    if(!('Notification' in window)||!('PushManager' in window)||!('serviceWorker' in navigator))throw Error('This iPhone does not support web push in the current browser mode.');
    if(Notification.permission==='denied')throw Error('Notifications are blocked for this app in iPhone Settings.');
    const permission=Notification.permission==='granted'?'granted':await Notification.requestPermission();
    if(permission!=='granted')throw Error('Notification permission was not granted. Check Settings > Notifications, then try again.');
    const worker=await ensureWorkerURL();
    const reg=await getPushRegistration();
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      const r=await fetch(`${worker}/vapid-public-key`,{cache:'no-store'});if(!r.ok)throw Error(`Notification service returned HTTP ${r.status}.`);
      const {publicKey}=await r.json();
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(publicKey)});
    }
    const response=await fetch(`${worker}/subscribe`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),favorites,appUrl:location.origin+location.pathname})});
    if(!response.ok)throw Error(`Could not save notification subscription (HTTP ${response.status}).`);
    setNotifyMessage('Alerts are enabled. Favorite-team and Upset Alert notifications will arrive even when the scoreboard is closed.');
    await updateNotifyButton();
  }catch(err){setNotifyMessage(err.message||String(err));}
  finally{btn.disabled=false;}
}
$('notifyBtn').onclick=enableNotifications;

async function load(){
  const button=$('refresh');button.disabled=true;
  $('heading').textContent=`Week ${week}`;
  $('weekSelect').value=String(week);
  const conferenceLabel=$('conference').selectedOptions[0]?.textContent||'All FBS';
  $('status').textContent=`Loading ${conferenceLabel} games for the week…`;
  $('summary').textContent='';
  try{
    const events=(await getWholeWeekEvents()).sort((a,b)=>new Date(a.date)-new Date(b.date));
    render(events);
    $('status').textContent='';
    $('summary').textContent=`${events.length} games · ${conferenceLabel} · Live first · Finals last`;
    $('updated').textContent=`· Updated ${new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'}).format(new Date())} CT`;
    if(!events.length)$('summary').textContent+=' · Provider returned no events';
  }catch(err){
    $('games').innerHTML='<div class="empty">Could not load scores. The data provider may be unavailable or blocking browser requests. Try Refresh. If this continues, we will add a data proxy.</div>';
    $('status').textContent='Data request failed: '+err.message;
    $('summary').textContent='';
  }finally{
    button.disabled=false;history.replaceState(null,'',`?year=${season}&week=${week}&conference=${conference}${manualSelection?'&manual=1':''}`);
  }
}
$('weekSelect').onchange=e=>{manualSelection=true;week=Number(e.target.value);load();};
$('season').onchange=e=>{manualSelection=true;season=Number(e.target.value);load();};
$('conference').onchange=e=>{conference=String(e.target.value);load();};
$('refresh').onclick=load;
$('games').addEventListener('click',e=>{
  const day=e.target.closest('[data-day]');
  if(day){toggleDay(day.dataset.day);return;}
  const btn=e.target.closest('[data-favorite]');
  if(btn){toggleFavorite(btn.dataset.favorite);return;}
  const close=e.target.closest('.stats-close');
  if(close){const panel=close.closest('.stats-panel');if(panel)panel.hidden=true;return;}
  const team=e.target.closest('[data-game-stats]');
  if(team){toggleGameStats(team.dataset.gameStats,team.closest('.card'));return;}
});
$('games').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-game-stats]')){e.preventDefault();toggleGameStats(e.target.dataset.gameStats,e.target.closest('.card'));}
});
const topBtn=$('topBtn');
window.addEventListener('scroll',()=>topBtn.classList.toggle('show',window.scrollY>500),{passive:true});
topBtn.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
(async()=>{
  try{await getPushRegistration();await updateNotifyButton();}catch{}
  if(!manualSelection)await detectCurrentWeek();
  await load();
})();
setInterval(()=>{if(document.visibilityState==='visible')load();},60000);
</script></body></html>
